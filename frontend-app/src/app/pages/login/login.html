<div class="login-page">
  <div class="login-card">

    <div class="brand">
      <div class="logo">IMS</div>
      <h1>Incident Management</h1>
      <p>Sign in to manage production incidents</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@incident.local"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <div class="demo-account">
      <strong>Demo account</strong>
      <span>admin@incident.local</span>
      <span>Admin@123</span>
    </div>

  </div>
</div>
